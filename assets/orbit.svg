<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 130" width="100%">
  <defs>
    <style>
      .orbit {
        animation: orbit 6s linear infinite;
        transform-origin: 60px 65px;
        transform-box: view-box;
      }
      .orbit2 {
        animation: orbit 10s linear infinite reverse;
        transform-origin: 60px 65px;
        transform-box: view-box;
      }
      .orbit3 {
        animation: orbit 14s linear infinite;
        transform-origin: 60px 65px;
        transform-box: view-box;
      }
      @keyframes orbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      .blink {
        animation: blink 1.2s steps(2, start) infinite;
      }
      @keyframes blink {
        to { visibility: hidden; }
      }
    </style>
  </defs>

  <circle cx="60" cy="65" r="38" fill="none" stroke="#30363d" stroke-width="2" />
  <circle cx="60" cy="65" r="52" fill="none" stroke="#21262d" stroke-width="1.5" />

  <g class="orbit">
    <circle cx="60" cy="13" r="6" fill="#F75C7E" />
  </g>
  <g class="orbit2">
    <circle cx="60" cy="117" r="5" fill="#00D4FF" />
  </g>
  <g class="orbit3">
    <circle cx="12" cy="65" r="4" fill="#FFD700" />
  </g>

  <g class="pulse">
    <text x="60" y="76" font-family="'Fira Code', monospace, sans-serif" font-size="34" font-weight="bold" fill="#F75C7E" text-anchor="middle">P</text>
  </g>

  <text x="130" y="62" font-family="'Fira Code', monospace, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">PRASAD.GHAVGHAVE<span class="blink" fill="#F75C7E">_</span></text>
  <text x="130" y="86" font-family="'Fira Code', monospace, sans-serif" font-size="14" fill="#8b949e">&gt; linux admin · devops · ai research</text>
  <text x="130" y="106" font-family="'Fira Code', monospace, sans-serif" font-size="12" fill="#57606a">&gt; rhel 9 · ansible · 6 ieee publications</text>
</svg>
