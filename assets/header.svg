<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%">
  <defs>
    <linearGradient id="winbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F75C7E" />
      <stop offset="50%" stop-color="#7F5AF0" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>
    <style>
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes glow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .glow { animation: glow 2s ease-in-out infinite; }
      @keyframes loadbar { from { width: 0; } to { width: 944px; } }
      .loadbar { animation: loadbar 4s ease-in-out infinite alternate; }
    </style>
  </defs>

  <rect width="1000" height="260" rx="14" fill="url(#winbg)" stroke="#30363d" stroke-width="2" />

  <line x1="0" y1="42" x2="1000" y2="42" stroke="#30363d" stroke-width="2" />
  <circle cx="26" cy="21" r="6" fill="#FF5F57" />
  <circle cx="46" cy="21" r="6" fill="#FEBC2E" />
  <circle cx="66" cy="21" r="6" fill="#28C840" />
  <text x="92" y="27" font-family="'Fira Code', monospace, sans-serif" font-size="14" fill="#8b949e">prasad@rhel9: ~</text>

  <text x="28" y="80" font-family="'Fira Code', monospace, sans-serif" font-size="18">
    <tspan fill="#00D4FF">prasad@rhel9</tspan>
    <tspan fill="#8b949e">:</tspan>
    <tspan fill="#FFD700">~</tspan>
    <tspan fill="#F75C7E">$</tspan>
    <tspan fill="#e6edf3"> whoami</tspan>
  </text>
  <text x="28" y="108" font-family="'Fira Code', monospace, sans-serif" font-size="16" fill="#8b949e">Junior Linux System Administrator · AI Researcher</text>

  <text x="28" y="142" font-family="'Fira Code', monospace, sans-serif" font-size="18">
    <tspan fill="#00D4FF">prasad@rhel9</tspan>
    <tspan fill="#8b949e">:</tspan>
    <tspan fill="#FFD700">~</tspan>
    <tspan fill="#F75C7E">$</tspan>
    <tspan fill="#e6edf3"> cat skills.txt</tspan>
  </text>
  <text x="28" y="170" font-family="'Fira Code', monospace, sans-serif" font-size="16" fill="#00D4FF">RHEL 9 · Ansible · Docker · SELinux · OpenShift</text>

  <text x="28" y="204" font-family="'Fira Code', monospace, sans-serif" font-size="18">
    <tspan fill="#00D4FF">prasad@rhel9</tspan>
    <tspan fill="#8b949e">:</tspan>
    <tspan fill="#FFD700">~</tspan>
    <tspan fill="#F75C7E">$</tspan>
