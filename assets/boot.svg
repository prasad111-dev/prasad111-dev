<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="100%">
  <defs>
    <linearGradient id="bbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <style>
      .ln { opacity: 0; animation: fadein 0.3s ease forwards; }
      .ok { opacity: 0; animation: fadein 0.3s ease forwards; }
      @keyframes fadein { to { opacity: 1; } }
      .l1 { animation-delay: 0.3s; } .l2 { animation-delay: 1.1s; }
      .l3 { animation-delay: 1.9s; } .l4 { animation-delay: 2.7s; }
      .l5 { animation-delay: 3.5s; } .l6 { animation-delay: 4.3s; }
      .l7 { animation-delay: 5.1s; }
      .o1 { animation-delay: 0.6s; } .o2 { animation-delay: 1.4s; }
      .o3 { animation-delay: 2.2s; } .o4 { animation-delay: 3.0s; }
      .o5 { animation-delay: 3.8s; } .o6 { animation-delay: 4.6s; }
      .o7 { animation-delay: 5.4s; }
      .login { opacity: 0; animation: fadein 0.4s ease 6.4s forwards; }
      @keyframes bar { from { width: 0; } to { width: 864px; } }
      .bar { animation: bar 3.2s ease-out 1.2s forwards; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .cursor { animation: blink 1.1s steps(1) infinite; opacity: 0; animation-delay: 6.4s; }
    </style>
  </defs>

  <rect width="920" height="330" rx="12" fill="url(#bbg)" stroke="#30363d" stroke-width="2" />
  <line x1="0" y1="42" x2="920" y2="42" stroke="#30363d" stroke-width="2" />
  <circle cx="26" cy="21" r="6" fill="#FF5F57" />
  <circle cx="46" cy="21" r="6" fill="#FEBC2E" />
  <circle cx="66" cy="21" r="6" fill="#28C840" />
  <text x="92" y="27" font-family="'Fira Code', monospace, sans-serif" font-size="14" fill="#8b949e">prasad@rhel9: booting prasadOS v1.0</text>

  <text x="28" y="74" font-family="'Fira Code', monospace, sans-serif" font-size="15">
    <tspan class="ln l1 ok o1" fill="#28C840">[ OK ]</tspan><tspan class="ln l1" fill="#8b949e"> Loading kernel modules</tspan>
  </text>
  <text x="28" y="102" font-family="'Fira Code', monospace, sans-serif" font-size="15">
    <tspan class="ln l2 ok o2" fill="#28C840">[ OK ]</tspan><tspan class="ln l2" fill="#8b949e"> Mounting filesystem (RHEL 9)</tspan>
  </text>
  <text x="28" y="130" font-family="'Fira Code', monospace, sans-serif" font-size="15">
    <tspan class="ln l3 ok o3" fill="#28C840">[ OK ]</tspan><tspan class="ln l3" fill="#8b949e"> Starting network services</tspan>
  </text>
  <text x="28" y="158" font-family="'Fira Code', monospace, sans-serif" font-size="15">
    <tspan class="ln l4 ok o4" fill="#28C840">[ OK ]</tspan><tspan class="ln l4" fill="#8b949e"> Starting Ansible automation daemon</tspan>
  </text>
  <text x="28" y="186" font-family="'Fira Code', monospace, sans-serif" font-size="15">
    <tspan class="ln l5 ok o5" fill="#28C840">[ OK ]</tspan><tspan class="ln l5" fill="#8b949e"> Starting Docker container runtime</tspan>
  </text>
  <text x="28" y="214" font-family="'Fira Code', monospace, sans-serif" font-size="15">
    <tspan class="ln l6 ok o6" fill="#28C840">[ OK ]</tspan><tspan class="ln l6" fill="#8b949e"> Loading AI models (CNN · YOLOv8)</tspan>
  </text>
  <text x="28" y="242" font-family="'Fira Code', monospace, sans-serif" font-size="15">
    <tspan class="ln l7 ok o7" fill="#28C840">[ OK ]</tspan><tspan class="ln l7" fill="#8b949e"> Loading research stack · 6 IEEE papers</tspan>
  </text>

  <rect class="bar" x="28" y="262" width="0" height="6" rx="3" fill="#00D4FF" />
  <rect x="28" y="262" width="864" height="6" rx="3" fill="none" stroke="#21262d" stroke-width="1" />

  <text class="login" x="28" y="308" font-family="'Fira Code', monospace, sans-serif" font-size="16">
    <tspan fill="#00D4FF">prasad@rhel9</tspan>
    <tspan fill="#8b949e">:</tspan>
    <tspan fill="#FFD700">~</tspan>
    <tspan fill="#e6edf3"> login: </tspan>
  </text>
  <text class="cursor" x="96" y="308" font-family="'Fira Code', monospace, sans-serif" font-size="16" fill="#F75C7E">▍</text>
</svg>
